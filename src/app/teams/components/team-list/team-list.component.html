<section
  class="team-list"
  aria-labelledby="team-list-title"
  [attr.aria-busy]="state().status === 'loading'"
>
  <header class="team-list__heading">
    <h2 id="team-list-title">
      Your teams <span>{{ state().data.length }}</span>
    </h2>
    <button
      type="button"
      class="button button--secondary"
      [disabled]="state().status === 'loading' || state().pendingIds.length > 0"
      (click)="retry.emit()"
    >
      <img
        src="assets/icons/ic_refresh.svg"
        width="16"
        height="16"
        alt=""
        aria-hidden="true"
      />Refresh teams
    </button>
  </header>
  @if (state().status === 'loading' || state().status === 'idle') {
    <div class="team-list__state">
      <app-async-state
        status="loading"
        title="Loading your teams"
        message="Getting your saved lineups."
      />
    </div>
  } @else if (state().status === 'error') {
    <div class="team-list__state">
      <app-async-state
        status="error"
        title="Your teams couldn’t load"
        [message]="state().error ?? 'Start the mock server and try again.'"
        (retry)="retry.emit()"
      />
    </div>
  } @else if (!state().data.length) {
    <div class="team-list__state">
      <app-async-state
        status="empty"
        title="Your first team starts here"
        message="Choose a name and your favorite Pokémon in the builder."
      />
    </div>
  } @else {
    <ul class="team-list__cards">
      @for (team of state().data; track team.id) {
        <li class="team-list__card" [class.team-list__card--selected]="selectedId() === team.id">
          <button
            class="team-list__select"
            type="button"
            [attr.aria-pressed]="selectedId() === team.id"
            (click)="selected.emit(team.id)"
          >
            <span class="team-list__name">{{ team.name }}</span
            ><span class="team-list__meta"
              >{{ team.pokemonIds.length }} Pokémon ·
              {{ team.pending ? 'Saving…' : 'Ready to explore' }}</span
            >
          </button>
          <button
            class="icon-button"
            type="button"
            [attr.aria-label]="'Delete team ' + team.name"
            [disabled]="team.pending || state().pendingIds.includes(team.id)"
            (click)="deleted.emit(team.id)"
          >
            <img
              src="assets/icons/ic_delete.svg"
              width="18"
              height="18"
              alt=""
              aria-hidden="true"
            />
          </button>
        </li>
      }
    </ul>
  }
</section>
