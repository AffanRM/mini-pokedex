<header class="app-shell__header">
  <div class="app-shell__header-inner">
    <a class="app-shell__brand" routerLink="/" aria-label="Mini Pokédex home">
      <img src="assets/icons/ic_pokeball.svg" width="34" height="34" alt="" aria-hidden="true" />
      <span>Mini <strong>Pokédex</strong></span>
    </a>
    <nav aria-label="Main navigation">
      <a
        class="app-shell__nav-link"
        routerLink="/"
        routerLinkActive="app-shell__nav-link--active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        >Pokédex</a
      >
      <a
        class="app-shell__nav-link"
        routerLink="/teams"
        routerLinkActive="app-shell__nav-link--active"
        ariaCurrentWhenActive="page"
        >Teams</a
      >
    </nav>
    <span class="app-shell__edition">FIELD EDITION <span>01</span></span>
  </div>
</header>
<router-outlet />
